name: Daily raw metrics update

# Runs after each successful "Daily survey cache refresh" (04:17 UTC, though GitHub
# may start it later). Updates ONLY response volume, ratings and NSAT: every month's
# totals are recounted from the whole survey cache (data/survey_cache.csv), so a
# missed or rolled-back update corrects itself on the next run. No NLP models, so
# it installs and runs fast. Comments, topics and sentiment come from
# daily_full_pipeline.yml. Needs no SurveyMonkey secrets: only the cache refresh
# talks to SurveyMonkey.
on:
  workflow_run:
    workflows: ["Daily survey cache refresh"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false  

jobs:
  update-raw-metrics:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-daily.txt

      - name: Update raw metrics
        env:
          USE_LOCAL_CACHE: "true"
        run: python update_raw_metrics.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Daily raw metrics update — $(date -u +%Y-%m-%d)"

          # If something else pushed to main while this job ran, the push is rejected
          # ("fetch first"). Pull their commits underneath ours and retry, up to 3 times.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "Could not push after 3 attempts"
          exit 1

        
